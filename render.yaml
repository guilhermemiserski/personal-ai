services:
  - type: web
    name: personal-ai-trainer-api
    runtime: docker
    plan: free
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: GROQ_FALLBACK_MODEL
        value: llama-3.1-8b-instant
      - key: GROQ_REQUEST_TIMEOUT_SECONDS
        value: "22"
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: personal-ai-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: WGER_BASE_URL
        value: https://wger.de
      - key: WGER_LANGUAGE_ID
        value: "7"

  - type: web
    name: personal-ai-web
    runtime: node
    plan: free
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: /api
      - key: API_PROXY_URL
        fromService:
          type: web
          name: personal-ai-trainer-api
          envVarKey: RENDER_EXTERNAL_URL
